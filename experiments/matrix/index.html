<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Avelin — Morph Grid</title>

  <style>
    :root {
      --sa-bg: #050505;
      --sa-bg-2: #0a0808;
      --sa-lime: #C7F000;
      --sa-lime-soft: rgba(199, 240, 0, 0.12);
      --sa-purple: #2B073C;
      --sa-white: #F2F2F2;
      --sa-font: "Poppins", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--sa-bg);
      color: var(--sa-lime);
      font-family: var(--sa-font);
    }

    body {
      min-height: 100svh;
    }

    .sa-stage {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      isolation: isolate;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 35% 40%, rgba(199, 240, 0, 0.08) 0%, transparent 35%),
        radial-gradient(circle at 65% 65%, rgba(43, 7, 60, 0.35) 0%, transparent 40%),
        radial-gradient(circle at 20% 80%, rgba(199, 240, 0, 0.04) 0%, transparent 30%),
        linear-gradient(135deg, #030303 0%, var(--sa-bg-2) 50%, #050505 100%);
    }

    /* ============ Header / Brand ============ */
    .sa-header {
      position: absolute;
      top: clamp(20px, 3vw, 48px);
      left: clamp(20px, 3vw, 48px);
      z-index: 20;
      color: var(--sa-lime);
      font-size: clamp(0.75rem, 1vw, 0.95rem);
      font-weight: 400;
      letter-spacing: 0.05em;
      text-decoration: none;
      opacity: 0;
      transform: translateY(-12px);
      animation: morphFadeIn 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards 400ms;
    }

    /* ============ Main Content Area ============ */
    .sa-content {
      position: relative;
      z-index: 15;
      display: grid;
      place-items: center;
      width: min(95vw, 1400px);
      height: auto;
      pointer-events: none;
    }

    /* ============ Word Display ============ */
    .sa-word-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      opacity: 0;
      transform: scale(0.92);
      animation: morphContentIn 1000ms cubic-bezier(0.16, 1, 0.3, 1) forwards 500ms;
    }

    .sa-word-background {
      position: absolute;
      width: clamp(300px, 60vw, 800px);
      height: clamp(150px, 30vh, 400px);
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(199, 240, 0, 0.15) 0%,
        rgba(199, 240, 0, 0.08) 30%,
        transparent 70%
      );
      filter: blur(80px);
      animation: morphGlowPulse 4s ease-in-out infinite;
    }

    @keyframes morphGlowPulse {
      0%, 100% {
        transform: scale(0.95);
        opacity: 0.7;
      }
      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    .sa-word {
      position: relative;
      z-index: 2;
      margin: 0;
      color: var(--sa-lime);
      font-size: clamp(3.5rem, 12vw, 14rem);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.05em;
      text-align: center;
      text-transform: lowercase;
      text-shadow:
        0 0 20px rgba(199, 240, 0, 0.4),
        0 0 60px rgba(199, 240, 0, 0.2),
        0 0 120px rgba(199, 240, 0, 0.1);
      will-change: transform, opacity, filter;
    }

    .sa-word.is-out {
      animation: morphWordOut 500ms cubic-bezier(0.4, 0, 0.6, 1) forwards;
    }

    .sa-word.is-in {
      animation: morphWordIn 600ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes morphWordOut {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
      100% {
        opacity: 0;
        transform: scale(0.8) translateY(-30px);
        filter: blur(20px);
      }
    }

    @keyframes morphWordIn {
      0% {
        opacity: 0;
        transform: scale(0.8) translateY(30px);
        filter: blur(20px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    /* ============ Footer / Meta ============ */
    .sa-footer {
      position: absolute;
      bottom: clamp(20px, 3vw, 48px);
      right: clamp(20px, 3vw, 48px);
      z-index: 20;
      text-align: right;
      font-size: clamp(0.65rem, 0.9vw, 0.85rem);
      line-height: 1.6;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      color: rgba(242, 242, 242, 0.5);
      opacity: 0;
      transform: translateY(12px);
      animation: morphFadeIn 900ms cubic-bezier(0.16, 1, 0.3, 1) forwards 600ms;
    }

    .sa-footer-label {
      color: var(--sa-lime);
      font-weight: 500;
    }

    /* ============ Background Grid System ============ */
    .sa-background {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
    }

    .sa-grid-cards {
      position: absolute;
      inset: -10%;
      opacity: 0;
      animation: morphGridFadeIn 1200ms cubic-bezier(0.16, 1, 0.3, 1) forwards 300ms;
    }

    .sa-card {
      position: absolute;
      border: 1px solid rgba(199, 240, 0, 0.18);
      border-radius: clamp(12px, 2vw, 28px);
      background: radial-gradient(
        circle at 20% 20%,
        rgba(199, 240, 0, 0.08),
        rgba(199, 240, 0, 0.02) 40%,
        transparent 100%
      );
      backdrop-filter: blur(1px);
      animation: morphFloat var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .sa-card::before {
      content: "";
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--sa-lime);
      opacity: 0.6;
      box-shadow: 0 0 12px rgba(199, 240, 0, 0.5);
      top: clamp(8px, 1.2vw, 14px);
      left: clamp(8px, 1.2vw, 14px);
      animation: morphDotPulse 2.5s ease-in-out infinite;
      animation-delay: var(--dot-delay);
    }

    .sa-card--1 {
      width: 28vw;
      height: 32vh;
      left: 4%;
      top: 12%;
      --duration: 8s;
      --delay: 0s;
      --dot-delay: 0.3s;
    }

    .sa-card--2 {
      width: 22vw;
      height: 26vh;
      right: 5%;
      top: 18%;
      --duration: 9s;
      --delay: -1.2s;
      --dot-delay: 0.6s;
    }

    .sa-card--3 {
      width: 35vw;
      height: 24vh;
      right: 8%;
      bottom: 14%;
      --duration: 7.5s;
      --delay: -2.4s;
      --dot-delay: 1s;
    }

    .sa-card--4 {
      width: 24vw;
      height: 28vh;
      left: 6%;
      bottom: 10%;
      --duration: 10s;
      --delay: -1.6s;
      --dot-delay: 0.2s;
    }

    .sa-card--5 {
      width: 18vw;
      height: 20vh;
      left: 45%;
      top: 6%;
      border-color: rgba(199, 240, 0, 0.12);
      --duration: 7s;
      --delay: -2.8s;
      --dot-delay: 1.2s;
    }

    @keyframes morphFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) rotate(-0.8deg);
      }
      50% {
        transform: translate3d(var(--tx, 1.2vw), var(--ty, 1.5vh), 0) rotate(0.8deg);
      }
    }

    @keyframes morphDotPulse {
      0%, 100% {
        transform: scale(1);
        opacity: 0.6;
      }
      50% {
        transform: scale(1.4);
        opacity: 1;
      }
    }

    /* ============ Connecting Lines ============ */
    .sa-lines {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .sa-line {
      position: absolute;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(199, 240, 0, 0.4),
        rgba(199, 240, 0, 0.25),
        transparent
      );
      animation: morphLineDraw var(--speed) ease-in-out infinite;
      animation-delay: var(--delay);
      transform-origin: left center;
    }

    .sa-line--1 {
      width: 32vw;
      left: 16%;
      top: 28%;
      transform: rotate(8deg);
      --speed: 6s;
      --delay: 0s;
    }

    .sa-line--2 {
      width: 40vw;
      left: 38%;
      top: 42%;
      transform: rotate(-6deg);
      --speed: 7.5s;
      --delay: -1.8s;
    }

    .sa-line--3 {
      width: 28vw;
      left: 12%;
      bottom: 26%;
      transform: rotate(-12deg);
      --speed: 6.8s;
      --delay: -2.6s;
    }

    .sa-line--4 {
      width: 36vw;
      right: 8%;
      bottom: 32%;
      transform: rotate(5deg);
      --speed: 8s;
      --delay: -3.4s;
    }

    @keyframes morphLineDraw {
      0% {
        opacity: 0.15;
        clip-path: inset(0 100% 0 0);
      }
      30% {
        opacity: 0.6;
      }
      70% {
        opacity: 0.6;
      }
      100% {
        opacity: 0.15;
        clip-path: inset(0 0 0 100%);
      }
    }

    /* ============ Ambient Dot Field ============ */
    .sa-dot-field {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background-image: radial-gradient(circle, rgba(199, 240, 0, 0.35) 0 0.5px, transparent 0.5px);
      background-size: 64px 64px;
      mask-image: radial-gradient(circle at center, transparent 0 15%, black 40%, transparent 85%);
      opacity: 0.16;
      animation: morphDotDrift 20s linear infinite;
    }

    @keyframes morphDotDrift {
      to {
        background-position: 128px 128px;
      }
    }

    /* ============ Accent Glow Areas ============ */
    .sa-glow-area {
      position: absolute;
      border-radius: 999px;
      filter: blur(120px);
      pointer-events: none;
      opacity: 0.08;
    }

    .sa-glow--primary {
      width: 400px;
      height: 300px;
      background: var(--sa-lime);
      top: 20%;
      left: 10%;
      animation: morphGlowShift 10s ease-in-out infinite;
    }

    .sa-glow--secondary {
      width: 350px;
      height: 280px;
      background: var(--sa-purple);
      bottom: 15%;
      right: 12%;
      animation: morphGlowShift 12s ease-in-out infinite reverse;
      animation-delay: -2s;
    }

    @keyframes morphGlowShift {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(40px, 50px);
      }
    }

    /* ============ Intro Overlay ============ */
    .sa-intro {
      position: fixed;
      inset: 0;
      z-index: 40;
      pointer-events: none;
      background: #050505;
      animation: morphIntroOut 1000ms cubic-bezier(0.16, 1, 0.3, 1) forwards 300ms;
    }

    @keyframes morphIntroOut {
      0% {
        opacity: 1;
        clip-path: inset(0);
      }
      100% {
        opacity: 0;
        clip-path: inset(0 0 100% 0);
      }
    }

    /* ============ Responsive ============ */
    @media (max-width: 900px) {
      .sa-card--1 {
        width: 48vw;
        height: 24vh;
        left: -8%;
      }
      .sa-card--2 {
        width: 38vw;
        height: 20vh;
        right: -6%;
      }
      .sa-card--3 {
        width: 52vw;
        height: 18vh;
        right: -12%;
      }
      .sa-card--4 {
        width: 42vw;
        height: 20vh;
        left: -10%;
      }
      .sa-card--5 {
        display: none;
      }
    }

    @media (max-width: 600px) {
      .sa-word {
        font-size: clamp(2.5rem, 10vw, 5rem);
      }

      .sa-footer {
        display: none;
      }

      .sa-card--1,
      .sa-card--2,
      .sa-card--3,
      .sa-card--4 {
        opacity: 0.4;
        border-color: rgba(199, 240, 0, 0.08);
      }

      .sa-line {
        opacity: 0.1 !important;
      }

      .sa-dot-field {
        display: none;
      }
    }

    /* ============ Reduced Motion ============ */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .sa-intro {
        display: none;
      }

      .sa-header,
      .sa-content,
      .sa-footer,
      .sa-grid-cards {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>
  <div class="sa-intro" aria-hidden="true"></div>

  <main class="sa-stage" aria-label="Studio Avelin Morph Grid Experiment">
    <!-- Header -->
    <a href="https://studio-avelin.com" class="sa-header" aria-label="studio-avelin.com">studio-avelin.com</a>

    <!-- Background Elements -->
    <div class="sa-background">
      <div class="sa-glow-area sa-glow--primary" aria-hidden="true"></div>
      <div class="sa-glow-area sa-glow--secondary" aria-hidden="true"></div>

      <div class="sa-grid-cards" aria-hidden="true">
        <div class="sa-card sa-card--1"></div>
        <div class="sa-card sa-card--2"></div>
        <div class="sa-card sa-card--3"></div>
        <div class="sa-card sa-card--4"></div>
        <div class="sa-card sa-card--5"></div>
      </div>

      <div class="sa-lines" aria-hidden="true">
        <div class="sa-line sa-line--1"></div>
        <div class="sa-line sa-line--2"></div>
        <div class="sa-line sa-line--3"></div>
        <div class="sa-line sa-line--4"></div>
      </div>

      <div class="sa-dot-field" aria-hidden="true"></div>
    </div>

    <!-- Main Content -->
    <div class="sa-content">
      <div class="sa-word-container">
        <div class="sa-word-background" aria-hidden="true"></div>
        <h1 id="morphWord" class="sa-word" data-word="design." aria-live="polite">design.</h1>
      </div>
    </div>

    <!-- Footer -->
    <div class="sa-footer">
      <div><span class="sa-footer-label">experiment</span> / morph grid</div>
    </div>
  </main>

  <script>
    (() => {
      const word = document.getElementById("morphWord");
      const words = ["design.", "code.", "create."];
      let index = 0;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      function rotateWord() {
        word.classList.add("is-out");

        window.setTimeout(() => {
          index = (index + 1) % words.length;
          word.textContent = words[index];
          word.dataset.word = words[index];
          word.classList.remove("is-out");
          word.classList.add("is-in");
        }, 500);

        window.setTimeout(() => {
          word.classList.remove("is-in");
        }, 1100);
      }

      if (!reducedMotion) {
        window.setInterval(rotateWord, 3000);
      }
    })();
  </script>
</body>
</html>
