name: Deploy child theme

# Deploys studio-avelin-child/ to IONOS over SFTP.
#
# Trigger it manually from the Actions tab ("Run workflow" -> choose staging or
# production) — works from a phone browser too. Pushes to this branch that touch
# the theme also deploy to staging automatically.
#
# Repository secrets required (Settings -> Secrets and variables -> Actions):
#   IONOS_SFTP_HOST      e.g. access-5020051294.webspace-host.com
#   IONOS_SFTP_USER      e.g. su1946186
#   IONOS_SFTP_PASSWORD  the SFTP password

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to deploy"
        type: choice
        options:
          - staging
          - production
        default: staging
  push:
    branches:
      - feature/ich-marke-umbau
    paths:
      - "studio-avelin-child/**"
      - ".github/workflows/deploy.yml"

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve target
        id: t
        run: |
          T="${{ github.event.inputs.target }}"
          [ -n "$T" ] || T="staging"
          if [ "$T" = "production" ]; then
            echo "dir=clickandbuilds/StudioAvelin/wp-content/themes/studio-avelin-child/" >> "$GITHUB_OUTPUT"
          else
            echo "dir=clickandbuilds/StudioAvelinStaging/wp-content/themes/studio-avelin-child/" >> "$GITHUB_OUTPUT"
          fi
          echo "name=$T" >> "$GITHUB_OUTPUT"

      - name: PHP lint
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq php-cli
          fail=0
          while IFS= read -r -d '' f; do
            php -l "$f" >/dev/null || { echo "::error file=$f::PHP syntax error"; fail=1; }
          done < <(find studio-avelin-child -name '*.php' -print0)
          exit $fail

      - name: Check secrets
        env:
          H: ${{ secrets.IONOS_SFTP_HOST }}
          U: ${{ secrets.IONOS_SFTP_USER }}
          P: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          [ -n "$H" ] || { echo "::error::secret IONOS_SFTP_HOST is empty or missing"; exit 1; }
          [ -n "$U" ] || { echo "::error::secret IONOS_SFTP_USER is empty or missing"; exit 1; }
          [ -n "$P" ] || { echo "::error::secret IONOS_SFTP_PASSWORD is empty or missing"; exit 1; }
          echo "host=$H user=$U password=${#P} chars target=${{ steps.t.outputs.dir }}"

      - name: Deploy ${{ steps.t.outputs.name }}
        env:
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASS: ${{ secrets.IONOS_SFTP_PASSWORD }}
          REMOTE_DIR: ${{ steps.t.outputs.dir }}
        run: |
          sudo apt-get install -y -qq lftp
          lftp -c "set cmd:fail-exit yes; set sftp:auto-confirm yes; set net:timeout 20; set net:max-retries 2; set net:reconnect-interval-base 5; set mirror:parallel-transfer-count 3; open -u \"$SFTP_USER,$SFTP_PASS\" \"sftp://$SFTP_HOST\"; mirror -R --verbose --no-perms -X .DS_Store -X 'Icon*' -X '*.map' -x '/[.]git' -x '/node_modules/' studio-avelin-child/ \"$REMOTE_DIR\"; bye"

      - name: Summary
        run: |
          echo "### Deployed to ${{ steps.t.outputs.name }} :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.t.outputs.dir }}\`" >> "$GITHUB_STEP_SUMMARY"
